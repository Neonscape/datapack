name: Datapack Linux CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The runner image only ships Node/npm/git; Go and Wails are installed in-job.
# The image also bakes in http_proxy=127.0.0.1:7897, which is a dead address
# inside the job container (its loopback is not the host), so clear it here.
# Keep the local Gitea host out of any proxy as well.
env:
  http_proxy: ""
  https_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: "dev.projectmiraland.top,127.0.0.1,localhost"
  no_proxy: "dev.projectmiraland.top,127.0.0.1,localhost"
  # Git reads http.proxy from global/system config independently of the proxy
  # environment variables. These environment entries override that config
  # before actions/checkout starts.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.proxy"
  GIT_CONFIG_VALUE_0: ""

permissions:
  code: read
  releases: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev jq curl

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Wails
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          go version
          node --version
          npm --version
          wails version

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Build frontend assets for Go embed
        run: npm --prefix frontend run build

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Linux packaging safety
        run: |
          bash test/scripts/package-linux-release.test.sh
          bash test/scripts/release-gitea.test.sh
          bash test/scripts/release-alpha.test.sh

      - name: Check frontend types
        run: npm --prefix frontend run typecheck

      - name: Check frontend test source types
        run: npm --prefix frontend run typecheck:tests

      - name: Run end-to-end tests
        run: npm --prefix frontend run test:e2e

      - name: Build Linux binary
        run: ./scripts/build.sh -clean

      - name: Package release assets
        if: github.ref_type == 'tag'
        env:
          GITEA_REF_NAME: ${{ gitea.ref_name }}
        run: ./scripts/package-linux-release.sh "${GITEA_REF_NAME}"

      - name: Publish Gitea release
        if: github.ref_type == 'tag'
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_REF_NAME: ${{ gitea.ref_name }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: ./scripts/release-gitea.sh release
