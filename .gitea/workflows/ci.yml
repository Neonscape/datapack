name: Datapack Linux CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The Runner is expected to provide the build toolchain and its own outbound
# network configuration. Keep the local Gitea host out of any proxy.
env:
  NO_PROXY: "dev.projectmiraland.top,127.0.0.1,localhost"
  no_proxy: "dev.projectmiraland.top,127.0.0.1,localhost"
  # Git reads http.proxy from global/system config independently of the proxy
  # environment variables. These environment entries override that config
  # before actions/checkout starts.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.proxy"
  GIT_CONFIG_VALUE_0: ""

permissions:
  code: read
  releases: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check runner toolchain
        run: |
          set -euo pipefail
          command -v go
          command -v node
          command -v npm
          command -v wails
          go version
          node --version
          npm --version
          wails version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev jq curl

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Check frontend types
        run: npm --prefix frontend run typecheck

      - name: Run end-to-end tests
        run: npm --prefix frontend run test:e2e

      - name: Build Linux binary
        run: ./scripts/build.sh -clean

      - name: Package release assets
        if: github.ref_type == 'tag'
        env:
          GITEA_REF_NAME: ${{ gitea.ref_name }}
        run: ./scripts/package-linux-release.sh "${GITEA_REF_NAME}"

      - name: Publish Gitea release
        if: github.ref_type == 'tag'
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_REF_NAME: ${{ gitea.ref_name }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: ./scripts/release-gitea.sh release
